name: minggle
description: Minggle - Premium Dating App with Vedic Astrology Compatibility
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  google_sign_in: ^6.2.1
  go_router: ^13.0.1
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  flutter_riverpod: ^2.4.9
  http: ^1.2.0
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  pinput: ^3.0.0
  permission_handler: ^11.3.0
  url_launcher: ^6.2.4
  shimmer: ^3.0.0
  timeago: ^3.6.0
  uuid: ^4.3.3
  video_player: ^2.11.1
  camera: ^0.10.5+9
  google_maps_flutter: ^2.2.5
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
